name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Runners already ship a browser (Chrome on macOS, Edge on Windows) —
      # the plugin needs nothing else.
      - name: Smoke test (render, no clipboard)
        run: python tests/smoke_test.py

      - name: Clipboard test
        if: runner.os == 'macOS'
        run: python tests/smoke_test.py --clipboard
